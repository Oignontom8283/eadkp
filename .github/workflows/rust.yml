name: Rust CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EADKP_PRIMARY_BUILD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: thumbv7em-none-eabihf

      - name: Install just
        run: cargo install just

      - name: Build library for device
        run: cargo +nightly build --lib --release --target thumbv7em-none-eabihf

      - name: Build library for simulator
        run: cargo +nightly build --lib --release

      - name: Build all examples
        run: just exports

      - name: Show build output
        run: |
          echo "Device examples:"
          ls -lah target/thumbv7em-none-eabihf/release/examples/ || true
          echo "Build directory:"
          ls -lah build/ || true