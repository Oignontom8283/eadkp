name: Deploy Doc to GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "docs/**"

  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # nécessaire pour push sur gh-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire pour que VitePress génère les dates de dernière modif

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('docs/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        working-directory: docs
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build VitePress
        working-directory: docs
        run: npm run docs:build


      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist # dossier de sortie de VitePress
          publish_branch: gh-pages # branche cible pour GitHub Pages
          force_orphan: true # garde la branche propre (pas d'historique accumulé)